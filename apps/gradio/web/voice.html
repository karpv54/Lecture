<section class="voice-app" data-state="idle" lang="fr">
  <header class="brand-row">
    <div class="wordmark" aria-label="Lecture">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" aria-hidden="true"><path d="M5 7c4-1 7 0 10 3 3-3 6-4 10-3v16c-4-1-7 0-10 3-3-3-6-4-10-3V7Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M15 10v16" stroke="currentColor" stroke-width="1.8"/></svg>
      <span>lecture<span class="brand-dot">.</span></span>
    </div>
    <span class="small-note"><span class="note-dot"></span> Un moment pour vous</span>
  </header>

  <main class="conversation-stage">
    <div class="intro">
      <span class="eyebrow">UN PAS APRÈS L’AUTRE</span>
      <h1>On apprend,<br><span>ensemble.</span></h1>
      <p class="introduction">Un appui. Et on se parle.</p>
    </div>

    <section class="lesson-stage" hidden aria-label="Votre lecture">
      <p class="lesson-label">Un pas à la fois</p>
      <div class="teaching-tiles"></div>
      <div class="meaning-picture" hidden aria-label="Le sens du mot"></div>
    </section>

    <div class="voice-control">
      <div class="orb-area">
        <span class="orbit orbit-outer" aria-hidden="true"></span>
        <span class="orbit orbit-inner" aria-hidden="true"></span>
        <span class="halo" aria-hidden="true"></span>
        <button class="conversation-button" type="button" aria-label="Commencer la conversation" aria-pressed="false" aria-describedby="voice-hint">
          <svg class="mic-icon" width="53" height="64" viewBox="0 0 48 60" fill="none" aria-hidden="true"><rect x="16" y="5" width="16" height="29" rx="8" stroke="currentColor" stroke-width="2.6"/><path d="M9 25v3a15 15 0 0 0 30 0v-3M24 43v10M16 53h16" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
          <svg class="stop-icon" width="42" height="42" viewBox="0 0 42 42" fill="none" aria-hidden="true"><rect x="9" y="9" width="24" height="24" rx="5" fill="currentColor"/></svg>
        </button>
      </div>
      <span class="button-caption" aria-hidden="true">Commencer</span>
      <p class="voice-status" id="voice-hint" role="status" aria-live="polite">Appuyez sur le micro pour commencer.</p>
      <div class="sound-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    </div>
  </main>

  <footer class="comfort-note">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m12 20-8-8a5 5 0 0 1 8-6 5 5 0 0 1 8 6l-8 8Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
    <span>Ici, vous avancez à votre rythme. Aucun enregistrement conservé sur cet appareil.</span>
  </footer>
</section>
